<body><title>Мои расходы</title>

<style>
/* Layout: header with month switcher → 4 summary tiles → categories | days → operations ledger */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#15201D; --muted:#5B6A66; --line:#DCE3E0;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#DDF0EB;
  --danger:#C92A2A; --danger-soft:#FBE4E4; --warn:#B86E00; --good:#2B8A3E;
  --display:"Unbounded", "Onest", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 1px 2px rgba(20,32,29,.06), 0 8px 24px rgba(20,32,29,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --ink:#E5EEEB; --muted:#93A39E; --line:#27322E;
  --accent:#3FC1A7; --accent-ink:#04211B; --accent-soft:#133A33;
  --danger:#FF7676; --danger-soft:#3A1B1B; --warn:#F2B04A; --good:#6BD982;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --ink:#E5EEEB; --muted:#93A39E; --line:#27322E;
  --accent:#3FC1A7; --accent-ink:#04211B; --accent-soft:#133A33;
  --danger:#FF7676; --danger-soft:#3A1B1B; --warn:#F2B04A; --good:#6BD982;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--accent-soft);color:var(--ink)}
.month .label{min-width:150px;text-align:center;font-weight:600}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

.accsw{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.accsw button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:500;color:var(--muted)}
.accsw button:hover{color:var(--ink)}
.accsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.acc{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:var(--accent-soft);color:var(--ink)}
.acc.work{background:var(--ink);color:var(--bg)}
.overall{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:12px 20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.ov-t{font-weight:600;font-size:16px}
.ov{display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line);padding-left:16px}
.ov-k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ov-v{font-family:var(--display);font-weight:500;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inc{color:var(--good)} .neg{color:var(--danger)}
.ph .actions{gap:8px}
.clist{display:flex;flex-direction:column;gap:8px;max-height:min(50vh,420px);overflow:auto;padding:2px}
.cedit{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.cedit input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0}
.swatch{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);padding:0}
.cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.comment{display:block;font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap;font-weight:400}
.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;resize:vertical;min-height:60px}
@media (max-width:760px){.overall{grid-template-columns:repeat(3,minmax(0,1fr))}.ov-head{grid-column:1/-1}.ov-head+.ov{border-left:0;padding-left:0}}
@media (max-width:480px){.overall{grid-template-columns:minmax(0,1fr);gap:8px}.ov{border-left:0;padding-left:0;flex-direction:row;justify-content:space-between;align-items:baseline;gap:12px}}
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.notice.err{background:var(--danger-soft)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-weight:500;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-size:13px;color:var(--muted)}
.up{color:var(--danger)} .down{color:var(--good)}
.kpi.lead{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.lead .k,.kpi.lead .d{color:var(--accent-ink);opacity:.8}

.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:16px;font-weight:600;margin:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.cats{display:flex;flex-direction:column;gap:12px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;border:0;background:none;text-align:left;padding:4px 6px;margin:-4px -6px;border-radius:8px}
button.crow:hover{background:var(--bg)}
.crow.sel{background:var(--accent-soft)}
.cname{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.cname span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.camt{font-weight:600}
.track{grid-column:1/-1;position:relative;height:8px;background:var(--bg);border-radius:4px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:4px}
.limit{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.cmeta{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.cmeta .over{color:var(--danger);font-weight:600}
.cmeta .near{color:var(--warn);font-weight:600}
.bedit{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px 12px;align-items:center}
.bedit input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:right}
.empty{color:var(--muted);font-size:14px;padding:12px 0}

.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.zero{fill:var(--line)}
.chart .bar.today{fill:var(--ink)}
.chart .hit{fill:transparent}
.chart g:hover .bar{opacity:.75}
.daystat{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.daystat b{color:var(--ink);font-weight:600}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.65}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools input,.tools select{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tools input{flex:1 1 220px;min-width:0}

.ledger{width:100%;border-collapse:collapse}
.ledger th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.ledger td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger tbody tr{cursor:pointer}
.ledger tbody tr:hover{background:var(--bg)}
.ledger .r{text-align:right}
.ledger .amt{font-weight:600;white-space:nowrap}
.ledger .date{white-space:nowrap;color:var(--muted)}
.ledger .note{min-width:0;word-break:break-word}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.pill{font-size:11px;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.method{font-size:13px;color:var(--muted)}
.ltotal{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.ltotal b{color:var(--ink)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);display:flex;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal h3{margin:0;font-family:var(--display);font-weight:500;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
.amount-in{font-family:var(--display);font-size:24px!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.catpick label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px;cursor:pointer}
.catpick input{position:absolute;opacity:0;pointer-events:none}
.catpick label:has(input:checked){border-color:var(--ink);background:var(--bg);font-weight:600}
.catpick label:has(input:focus-visible){outline:2px solid var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px;font-size:14px;cursor:pointer;position:relative}
.seg label+label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);font-weight:600}
.mfoot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.mfoot .right{display:flex;gap:10px;margin-left:auto}
.err-text{color:var(--danger);font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  h1{font-size:22px}
  .ledger thead{display:none}
  .ledger,.ledger tbody{display:block}
  .ledger tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .ledger td{border:0;padding:0}
  .ledger td.note{grid-column:1;grid-row:1;font-weight:500}
  .ledger td.amt{grid-column:2;grid-row:1}
  .ledger td.cat{grid-column:1;grid-row:2}
  .ledger td.date{grid-column:2;grid-row:2;text-align:right;font-size:13px}
  .ledger td.method{display:none}
  .row2{grid-template-columns:1fr}
  .kpi .v{font-size:19px}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .35s ease}}
</style>

<div class="wrap">

<script>
const DEFAULT_EXP=[
  {id:'food',name:'Продукты',color:'#2F9E44'},
  {id:'cafe',name:'Кафе и рестораны',color:'#E8590C'},
  {id:'transport',name:'Транспорт',color:'#1C7ED6'},
  {id:'home',name:'Жильё и ЖКХ',color:'#7048E8'},
  {id:'telecom',name:'Связь и интернет',color:'#0C8599'},
  {id:'health',name:'Здоровье',color:'#E03131'},
  {id:'clothes',name:'Одежда',color:'#C2255C'},
  {id:'fun',name:'Развлечения',color:'#F08C00'},
  {id:'subs',name:'Подписки',color:'#5C7CFA'},
  {id:'gifts',name:'Подарки',color:'#D6336C'},
  {id:'edu',name:'Образование',color:'#66A80F'},
  {id:'other',name:'Другое',color:'#868E96'}
];
const DEFAULT_INC=[
  {id:'inc_salary',name:'Зарплата',color:'#2B8A3E'},
  {id:'inc_side',name:'Подработка',color:'#5C940D'},
  {id:'inc_refund',name:'Возврат и кэшбэк',color:'#0B7285'},
  {id:'inc_gift',name:'Подарок',color:'#AE3EC9'},
  {id:'inc_interest',name:'Проценты',color:'#1971C2'},
  {id:'inc_other',name:'Другой доход',color:'#495057'}
];
let CATS=DEFAULT_EXP,INCOME_CATS=DEFAULT_INC,ALLCATS=[...CATS,...INCOME_CATS],CAT=Object.fromEntries(ALLCATS.map(c=>[c.id,c]));
const UNCAT={id:'__none',name:'Без категории',color:'#868E96'};
const catOf=id=>CAT[id]||UNCAT;
const catKey=e=>CAT[e.category]?e.category:'__none';
let catsCfg=null;// null — стандартный набор категорий
function applyCats(cfg){
  const clean=a=>Array.isArray(a)?a.filter(c=>c&&c.id&&c.name).map(c=>({id:String(c.id).replace(/[^\w-]/g,'').slice(0,40),name:String(c.name).replace(/[<>&"]/g,'').trim().slice(0,40),color:/^#[0-9a-fA-F]{6}$/.test(c.color)?c.color:'#868E96'})).filter(c=>c.id&&c.name):[];
  const ex=cfg?clean(cfg.expense):[],inc=cfg?clean(cfg.income):[];
  catsCfg=(ex.length||inc.length)?{expense:ex.length?ex:DEFAULT_EXP,income:inc.length?inc:DEFAULT_INC}:null;
  CATS=catsCfg?catsCfg.expense:DEFAULT_EXP;INCOME_CATS=catsCfg?catsCfg.income:DEFAULT_INC;
  ALLCATS=[...CATS,...INCOME_CATS];CAT=Object.fromEntries(ALLCATS.map(c=>[c.id,c]));
}
const isExp=e=>e.type!=='income';
const catPickHtml=(type,sel)=>{const list=type==='income'?INCOME_CATS:CATS;const has=list.some(c=>c.id===sel);return list.map((c,i)=>`<label><input type="radio" name="cat" value="${c.id}" ${(c.id===sel||(!has&&i===0))?'checked':''}><span class="dot" style="background:${c.color}"></span>${c.name}</label>`).join('')};
const METHODS={card:'Карта',cash:'Наличные',transfer:'Перевод'};
const ACCOUNTS={personal:'Личный',work:'Рабочий'};
const accOf=e=>e.account==='work'?'work':'personal';
const inAcc=e=>state.acc==='all'||accOf(e)===state.acc;
function normBudgets(raw){if(!raw)return{personal:{},work:{}};if(raw.personal||raw.work)return{personal:raw.personal||{},work:raw.work||{}};return{personal:raw,work:{}}}
function curBudgets(){const b=state.budgets;if(state.acc!=='all')return b[state.acc]||{};const o={};for(const a of ['personal','work'])for(const[k,v]of Object.entries(b[a]||{}))o[k]=(o[k]||0)+(+v||0);return o}
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const LOCAL_KEY='expenses-local-v1';

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let backend=null;
function lsGet(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'null')}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LOCAL_KEY,JSON.stringify(v))}catch(e){}}
const uid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function startLocal(){
  let saved=lsGet();
  if(!saved){const ex=makeExamples();saved={items:ex.items,budgets:ex.budgets};lsSet(saved)}
  state.items=saved.items||[];state.budgets=normBudgets(saved.budgets);applyCats(saved.cats);state.mode='local';
  const persist=()=>lsSet({items:state.items,budgets:state.budgets,cats:catsCfg});
  backend={
    async add(e){state.items.push({...e,id:uid()});persist();render()},
    async update(id,e){state.items=state.items.map(x=>x.id===id?{...e,id}:x);persist();render()},
    async remove(id){state.items=state.items.filter(x=>x.id!==id);persist();render()},
    async setBudgets(b){state.budgets=b;persist();render()},
    async setCats(cfg){applyCats(cfg);persist();render()},
    async addMany(list){list.forEach(e=>state.items.push({...e,id:uid()}));persist();render()},
    async removeMany(ids){const s=new Set(ids);state.items=state.items.filter(x=>!s.has(x.id));persist();render()}

function startDb(db,userId){
  const profile=db.doc('data/users/'+userId+'/profile');
  const col=profile.collection('expenses');
  state.mode='db';state.dbLoaded=false;
  const timer=setTimeout(()=>{if(!state.dbLoaded){state.notice={err:true,text:'Данные пока не загрузились. Проверьте соединение, страница подхватит их сама.'};render()}},10000);
  col.orderBy('date','desc').limit(1000).onSnapshot(snap=>{
    state.items=snap.docs.map(d=>({...d.data(),id:d.id}));
    if(!snap.metadata.fromCache){state.dbLoaded=true;clearTimeout(timer);if(state.notice&&state.notice.err)state.notice=null}
    render();
  },err=>{clearTimeout(timer);state.dbLoaded=true;state.notice={err:true,text:'Не удалось загрузить расходы. Обновите страницу немного позже.'};render()});
  profile.onSnapshot(s=>{state.budgets=normBudgets(s.exists&&s.data().budgets);render()},()=>{});
  const guard=p=>p.catch(e=>{if(e&&e.code==='invalid_argument'){state.readOnly=true;toast('У вас нет прав на запись в этом расходнике.')}else if(e&&e.code==='quota_exceeded'){toast('Хранилище заполнено. Удалите старые записи.')}else{toast('Не удалось сохранить. Попробуйте ещё раз.')}render();throw e});
  const clean=e=>{const o={...e};delete o.id;return o};
  backend={
    add:e=>guard(col.doc().set(clean(e))),
    update:(id,e)=>guard(col.doc(id).set(clean(e))),
    remove:id=>guard(col.doc(id).delete()),
    setBudgets:b=>guard(profile.set({budgets:b})),
    async addMany(list){for(let i=0;i<list.length;i+=6){await Promise.all(list.slice(i,i+6).map(e=>guard(col.doc().set(clean(e)))))}},
    async removeMany(ids){for(let i=0;i<ids.length;i+=6){await Promise.all(ids.slice(i,i+6).map(id=>guard(col.doc(id).delete())))}}
  };
  render();
}

/* Облако Telegram: значение до 4096 символов, до 1024 ключей.
   Записи месяца хранятся под ключами m_ГГГГ_ММ_0, _1, … ; в начале части 0 стоит число частей ("3|…"). */
const CHUNK=3800;
const cs=(method,...args)=>new Promise((res,rej)=>tg.CloudStorage[method](...args,(err,val)=>err?rej(err):res(val)));
const monthOf=date=>date.slice(0,7).replace('-','_');
const pack=e=>[e.id,+e.date.slice(8,10),e.amount,e.category,e.method,e.account==='work'?1:0,e.note||'',e.example?1:0,e.createdAt||0,e.type==='income'?1:0,e.comment||''];
const unpack=(r,g)=>({id:r[0],date:g.replace('_','-')+'-'+pad(r[1]),amount:r[2],category:r[3],method:r[4],account:r[5]?'work':'personal',note:r[6],example:!!r[7],createdAt:r[8],type:r[9]?'income':'expense',comment:r[10]||''});
function splitChunks(json){const parts=[];for(let i=0;i<json.length;i+=CHUNK)parts.push(json.slice(i,i+CHUNK));if(!parts.length)parts.push('');parts[0]=parts.length+'|'+parts[0];return parts}
function joinChunks(get){const first=get(0);if(first==null)return null;const bar=first.indexOf('|');const n=parseInt(first.slice(0,bar),10);if(!(n>0))return null;let s=first.slice(bar+1);for(let i=1;i<n;i++){const p=get(i);if(p==null)return null;s+=p}return s}

const hasCloud=()=>!!(tg&&tg.CloudStorage&&tg.isVersionAtLeast('6.9'));
async function readCloudData(){
  const keys=await cs('getKeys');
  const vals={};
  for(let i=0;i<keys.length;i+=40)Object.assign(vals,await cs('getItems',keys.slice(i,i+40)));
  const budgets=normBudgets(vals.budgets?JSON.parse(vals.budgets):null);
  let cats=null;try{cats=vals.cats?JSON.parse(vals.cats):null}catch(e){}
  const months=new Set(keys.filter(k=>/^m_\d{4}_\d{2}_\d+$/.test(k)).map(k=>k.slice(2,9)));
  const items=[],broken=[],written={};
  months.forEach(g=>{
    written[g]=keys.filter(k=>k.startsWith('m_'+g+'_')).length;
    const s=joinChunks(i=>vals['m_'+g+'_'+i]);
    try{JSON.parse(s).forEach(r=>items.push(unpack(r,g)))}catch(e){broken.push(g.replace('_','.'))}
  });
  return {items,budgets,cats,broken,written};
}

async function startCloud(){
  state.mode='cloud';state.readOnly=false;state.notice=null;render();
  let written={};// месяц -> сколько частей лежит в облаке
  try{
    const d=await readCloudData();
    written=d.written;state.items=d.items;state.budgets=d.budgets;applyCats(d.cats);
    if(d.broken.length)state.notice={err:true,text:'Не удалось прочитать записи за '+d.broken.join(', ')+'. Остальные данные на месте.'};
  }catch(e){
    state.notice={err:true,text:'Не удалось загрузить данные из Telegram. Закройте приложение и откройте снова.'};
    state.readOnly=true;
  }
  state.dbLoaded=true;

  let queue=Promise.resolve();
  const enqueue=f=>(queue=queue.then(f,f));
  const fail=()=>toast('Не удалось сохранить в облако Telegram. Проверьте интернет.');
  const writeMonth=g=>enqueue(async()=>{
    const list=state.items.filter(e=>monthOf(e.date)===g).map(pack);
    const old=written[g]||0;
    try{
      let n=0;
      if(list.length){const parts=splitChunks(JSON.stringify(list));n=parts.length;for(let i=0;i<n;i++)await cs('setItem','m_'+g+'_'+i,parts[i])}
      const stale=[];for(let i=n;i<old;i++)stale.push('m_'+g+'_'+i);
      if(stale.length)await cs('removeItems',stale);
      written[g]=n;
    }catch(e){fail()}
  });
  const writeMonths=list=>Promise.all([...new Set(list.map(e=>monthOf(e.date)))].map(writeMonth));
  backend={
    async add(e){const it={...e,id:uid()};state.items.push(it);render();await writeMonth(monthOf(it.date))},
    async update(id,e){const old=state.items.find(x=>x.id===id);state.items=state.items.map(x=>x.id===id?{...e,id}:x);render();
      await writeMonth(monthOf(e.date));if(old&&monthOf(old.date)!==monthOf(e.date))await writeMonth(monthOf(old.date))},
    async remove(id){const old=state.items.find(x=>x.id===id);state.items=state.items.filter(x=>x.id!==id);render();if(old)await writeMonth(monthOf(old.date))},
    async setBudgets(b){state.budgets=b;render();await enqueue(()=>cs('setItem','budgets',JSON.stringify(b)).catch(fail))},
    async setCats(cfg){applyCats(cfg);render();await enqueue(()=>cs('setItem','cats',JSON.stringify(catsCfg)).catch(fail))},
    async addMany(list){const added=list.map(e=>({...e,id:uid()}));state.items.push(...added);render();await writeMonths(added)},
    async removeMany(ids){const s=new Set(ids);const gone=state.items.filter(x=>s.has(x.id));state.items=state.items.filter(x=>!s.has(x.id));render();await writeMonths(gone)}
  };
  render();
}

const kv={
  async get(k){if(hasCloud()){try{return (await cs('getItem',k))||null}catch(e){return null}}try{return localStorage.getItem('exp_'+k)}catch(e){return null}},
  async set(k,v){if(hasCloud())return cs('setItem',k,v);try{localStorage.setItem('exp_'+k,v)}catch(e){}},
  async del(k){if(hasCloud()){try{await cs('removeItem',k)}catch(e){}return}try{localStorage.removeItem('exp_'+k)}catch(e){}}
};

/* ---------- Общий доступ через закрытый репозиторий GitHub ---------- */
const GH_API='https://api.github.com';
const DATA_PATH='data.json';
const ROLE_NAMES={editor:'Редактор',viewer:'Только просмотр'};
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(b64){const bin=atob(String(b64||'').replace(/\s/g,''));const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
async function gh(cfg,method,path,body){
  let r;
  try{
    r=await fetch(GH_API+path,{method,cache:'no-store',headers:Object.assign({'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  }catch(e){const err=new Error('network');err.status=0;throw err}
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok){const err=new Error((data&&data.message)||('HTTP '+r.status));err.status=r.status;throw err}
  return data;
}
function ghErrText(e){
  const s=e&&e.status;
  if(s===0)return 'Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.';
  if(s===401)return 'Ключ не подходит или у него закончился срок. Создайте новый ключ и подключите его в разделе «Доступ».';
  if(s===404)return 'Репозиторий не найден или ключ не даёт к нему доступа. Проверьте название и настройки ключа.';
  if(s===403)return 'Ключ не даёт нужных прав на этот репозиторий.';
  if(s===413)return 'Файл с записями стал слишком большим для загрузки.';
  return 'GitHub ответил ошибкой: '+((e&&e.message)||'неизвестная ошибка');
}
async function ghRead(cfg){
  try{
    const d=await gh(cfg,'GET',`/repos/${cfg.repo}/contents/${DATA_PATH}`);
    if(!d.content&&d.size>0){const err=new Error('too big');err.status=413;throw err}
    const text=b64dec(d.content);const j=text.trim()?JSON.parse(text):{};
    return {sha:d.sha,data:{items:Array.isArray(j.items)?j.items:[],budgets:normBudgets(j.budgets),cats:j.cats||null}};
  }catch(e){if(e.status===404)return {sha:null,data:{items:[],budgets:normBudgets(null)}};throw e}
}
async function ghWrite(cfg,sha,data,message){
  // одна запись на строку, чтобы в истории GitHub было видно, что поменялось
  const body='{"version":1,"updatedAt":'+JSON.stringify(new Date().toISOString())+',\n"budgets":'+JSON.stringify(data.budgets)+',\n"cats":'+JSON.stringify(data.cats||null)+',\n"items":[\n'+data.items.map(e=>JSON.stringify(e)).join(',\n')+'\n]}\n';
  const req={message,content:b64enc(body)};if(sha)req.sha=sha;
  const d=await gh(cfg,'PUT',`/repos/${cfg.repo}/contents/${DATA_PATH}`,req);
  return d.content.sha;
}
async function detectRole(cfg){
  // Пробуем записать служебный файл: ключ «только чтение» GitHub не пропустит.
  const p=`/repos/${cfg.repo}/contents/.access-check`;
  let sha=null;
  try{sha=(await gh(cfg,'GET',p)).sha}catch(e){if(e.status!==404)throw e}
  try{
    const req={message:'Проверка ключа редактора',content:b64enc('Проверка доступа на запись: '+new Date().toISOString()+'\n')};if(sha)req.sha=sha;
    await gh(cfg,'PUT',p,req);return 'editor';
  }catch(e){if(e.status===403||e.status===404)return 'viewer';throw e}
}
function normRepo(s){return String(s||'').trim().replace(/^https?:\/\/(www\.)?github\.com\//i,'').replace(/\.git$/i,'').replace(/\/+$/,'')}
async function connectGitHub(repoRaw,tokenRaw){
  const repo=normRepo(repoRaw),token=String(tokenRaw||'').trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw new Error('Укажите репозиторий в виде «логин/expenses-data».');
  if(!token)throw new Error('Вставьте ключ доступа.');
  const cfg={repo,token};
  let info;
  try{info=await gh(cfg,'GET','/repos/'+repo)}catch(e){throw new Error(ghErrText(e))}
  if(!info.private)throw new Error('Репозиторий '+repo+' открытый: записи в нём увидят все. В настройках репозитория сделайте его закрытым (Private) и подключите снова.');
  try{cfg.role=await detectRole(cfg)}catch(e){throw new Error(ghErrText(e))}
  await kv.set('gh_repo',repo);await kv.set('gh_token',token);await kv.set('gh_role',cfg.role);await kv.del('mode_solo');
  return cfg;
}
async function loadCfg(){
  const [repo,token,role]=await Promise.all([kv.get('gh_repo'),kv.get('gh_token'),kv.get('gh_role')]);
  return repo&&token?{repo,token,role:role==='editor'?'editor':'viewer'}:null;
}

let ghCfg=null;
async function readLegacy(){
  // Записи, которые раньше хранились только у этого пользователя (облако Telegram или браузер).
  try{
    if(hasCloud()){const d=await readCloudData();return {items:d.items.filter(e=>!e.example),budgets:d.budgets}}
    const s=lsGet();return s?{items:(s.items||[]).filter(e=>!e.example),budgets:normBudgets(s.budgets)}:null;
  }catch(e){return null}
}

async function startGitHub(cfg){
  ghCfg=cfg;
  state.mode='gh';state.dbLoaded=false;state.readOnly=cfg.role!=='editor';state.notice=null;state.migrate=null;state.items=[];render();
  let sha=null,pending=0;
  const load=async()=>{const r=await ghRead(cfg);sha=r.sha;state.items=r.data.items;state.budgets=r.data.budgets;applyCats(r.data.cats)};
  try{await load()}
  catch(e){state.notice={err:true,text:ghErrText(e)};state.dbLoaded=true;state.readOnly=true;render();return}
  state.dbLoaded=true;

  let queue=Promise.resolve();
  const commit=(op,msg)=>{
    const local=op({items:state.items,budgets:state.budgets,cats:catsCfg});
    state.items=local.items;state.budgets=local.budgets;applyCats(local.cats);render();
    pending++;
    const p=queue.then(async()=>{
      try{
        for(let attempt=0;;attempt++){
          try{sha=await ghWrite(cfg,sha,{items:state.items,budgets:state.budgets,cats:catsCfg},msg);return}
          catch(e){
            if((e.status===409||e.status===422)&&attempt===0){
              // файл успели изменить с другого устройства: берём свежую версию и повторяем это изменение поверх неё
              const r=await ghRead(cfg);sha=r.sha;const merged=op(r.data);state.items=merged.items;state.budgets=merged.budgets;applyCats(merged.cats);render();continue;
            }
            throw e;
          }
        }
      }catch(e){
        if(e.status===403){state.readOnly=true;cfg.role='viewer';kv.set('gh_role','viewer');toast('У этого ключа доступ только для просмотра. Изменение не сохранено.')}
        else toast('Не сохранено. '+ghErrText(e));
        try{await load()}catch(_){}
        render();throw e;
      }finally{pending--}
    });
    queue=p.catch(()=>{});
    return p;
  };
  const amt=e=>money(+e.amount||0);
  backend={
    add(e){const it={...e,id:uid()};return commit(d=>({...d,items:[...d.items,it]}),'Добавлен расход: '+(e.note||CAT[e.category]?.name||'')+', '+amt(e))},
    update(id,e){return commit(d=>({...d,items:d.items.map(x=>x.id===id?{...e,id}:x)}),'Изменён расход: '+(e.note||'')+', '+amt(e))},
    remove(id){const old=state.items.find(x=>x.id===id);return commit(d=>({...d,items:d.items.filter(x=>x.id!==id)}),'Удалён расход: '+(old?(old.note||'')+', '+amt(old):id))},
    setBudgets(b){return commit(d=>({...d,budgets:b}),'Изменены лимиты')},
    setCats(c){return commit(d=>({...d,cats:c}),'Изменены категории')},
    addMany(list,msg){const added=list.map(e=>({...e,id:e.id||uid()}));return commit(d=>{const have=new Set(d.items.map(x=>x.id));return {...d,items:[...d.items,...added.filter(x=>!have.has(x.id))]}},msg||('Добавлено записей: '+added.length))},
    removeMany(ids){const s=new Set(ids);return commit(d=>({...d,items:d.items.filter(x=>!s.has(x.id))}),'Удалено записей: '+ids.length)}
  };
  state.refresh=async(manual)=>{
    if(pending||state.mode!=='gh')return;
    try{await load();render();if(manual)toast('Данные обновлены')}catch(e){if(manual)toast(ghErrText(e))}
  };

  if(cfg.role==='editor'&&(await kv.get('migrated'))!=='1'){
    const legacy=await readLegacy();
    if(legacy&&legacy.items.length){
      const have=new Set(state.items.map(x=>x.id));
      const fresh=legacy.items.filter(x=>!have.has(x.id));
      if(fresh.length)state.migrate={items:fresh,budgets:legacy.budgets};
    }
  }
  render();
}

  const cfg=await loadCfg();
  if(cfg)return startGitHub(cfg);
  if((await kv.get('mode_solo'))==='1')return startPersonal();
  state.mode='setup';render();openAccess(true);
}

function openAccess(first){
  const root=$('#modalRoot');
  const connected=state.mode==='gh'&&ghCfg;
  const info=connected?`<div class="notice"><span>Подключено к <b>${esc(ghCfg.repo)}</b>. Ваш доступ: <b>${ROLE_NAMES[ghCfg.role]||''}</b>.</span></div>`:
    state.mode==='cloud'||state.mode==='local'?`<div class="notice"><span>Сейчас записи видите только вы${state.mode==='cloud'?' (облако Telegram)':' (этот браузер)'}.</span></div>`:'';
  root.innerHTML=`<div class="overlay" id="ov"><form class="modal" id="af" novalidate>
    <h3>${first?'Подключение общего доступа':'Доступ'}</h3>
    ${info}
    <div class="sub">Общие записи лежат в закрытом репозитории GitHub. Ключ редактора позволяет добавлять и менять расходы, ключ «только чтение» даёт только просмотр. Ключ хранится ${tg?'в вашем облаке Telegram':'в этом браузере'} и никому не передаётся.</div>
    <div class="field"><label for="aRepo">Репозиторий с данными</label><input id="aRepo" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="логин/expenses-data" value="${esc(connected?ghCfg.repo:'')}"></div>
    <div class="field"><label for="aToken">${connected?'Новый ключ доступа':'Ключ доступа'}</label><input id="aToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"></div>
    <div class="err-text" id="aErr" hidden></div>
    <div class="mfoot">
      ${connected?'<button type="button" class="btn" id="aRefresh">Обновить данные</button><button type="button" class="btn danger" id="aOff">Отключить ключ</button>':''}
      ${!connected?'<button type="button" class="btn" id="aSolo">Пока без общего доступа</button>':''}
      <div class="right">${first?'':'<button type="button" class="btn" id="aCancel">Закрыть</button>'}<button type="submit" class="btn primary" id="aOk">Подключить</button></div>
    </div>
  </form></div>`;
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',onKey);if(tg){tg.BackButton.offClick(close);tg.BackButton.hide()}};

  document.addEventListener('keydown',onKey);

  const rf=$('#aRefresh');if(rf)rf.onclick=()=>{close();state.refresh&&state.refresh(true)};
  const off=$('#aOff');if(off)off.onclick=async()=>{
    if(!off.dataset.armed){off.dataset.armed='1';off.textContent='Точно отключить?';return}
    close();await kv.del('gh_token');await kv.del('gh_role');ghCfg=null;state.refresh=null;state.items=[];state.mode='setup';render();openAccess(true);
  };
  $('#af').onsubmit=async ev=>{
    ev.preventDefault();
    const err=$('#aErr'),ok=$('#aOk');err.hidden=true;ok.disabled=true;ok.textContent='Проверяю…';
    try{
      const cfg=await connectGitHub($('#aRepo').value,$('#aToken').value);

      toast(cfg.role==='editor'?'Подключено: можно добавлять и менять записи':'Подключено: режим просмотра');
    }catch(e){err.textContent=e.message||'Не удалось подключиться.';err.hidden=false;ok.disabled=false;ok.textContent='Подключить'}
  };
  setTimeout(()=>{const f=$('#aRepo');if(f&&!f.value)f.focus();else{const t=$('#aToken');if(t)t.focus()}},0);
}

/* ---------- examples ---------- */
function makeExamples(){
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const between=(a,b)=>Math.round((a+rnd()*(b-a))/10)*10;
  const items=[];const t=new Date();
  const add=(d,cat,note,amount,method='card',account='personal')=>items.push({date:iso(d),category:cat,note,amount,method,account,example:true,createdAt:Date.now()});
  for(const back of [1,0]){
    const y=t.getFullYear(),m=t.getMonth()-back;const base=new Date(y,m,1);
    const last=back?daysIn(base.getFullYear(),base.getMonth()):t.getDate();
    const D=day=>new Date(base.getFullYear(),base.getMonth(),day);
    const fixed=[[1,'transport','Проездной на месяц',2900],[5,'home','Аренда квартиры',35000,'transfer'],[10,'home','Коммунальные платежи',between(5600,6800)],[12,'subs','Музыкальный сервис',299],[15,'telecom','Мобильная связь',600],[15,'telecom','Домашний интернет',750],[20,'subs','Видеосервис',399]];
    fixed.forEach(f=>{if(f[0]<=last)add(D(f[0]),f[1],f[2],f[3],f[4])});
    for(let d=2;d<=last;d+=3)add(D(d),'food',rnd()<.5?'Супермаркет':'Продукты на неделю',between(900,3200));
    const extra=[['cafe','Кофе с собой',[180,320],9],['cafe','Обед в кафе',[450,900],5],['cafe','Ужин с друзьями',[1800,3600],1],['transport','Такси',[350,900],4],['health','Аптека',[300,1600],2],['fun','Кино',[600,1200],1],['fun','Концерт',[2500,4500],back],['clothes','Кроссовки',[5000,8000],back],['gifts','Подарок на день рождения',[2000,4000],1-back],['edu','Онлайн-курс',[3900,3900],back],['other','Стрижка',[1200,1500],1]];
    extra.forEach(([cat,note,[a,b],n])=>{for(let i=0;i<n;i++){const d=1+Math.floor(rnd()*last);add(D(d),cat,note,between(a,b),cat==='cafe'&&rnd()<.25?'cash':'card')}});
    [[3,'subs','Сервис для работы с документами',990],[8,'telecom','Рабочий телефон',500]].forEach(f=>{if(f[0]<=last)add(D(f[0]),f[1],f[2],f[3],'card','work')});
    const work=[['transport','Такси к клиенту',[400,1100],4],['cafe','Обед с клиентом',[1500,3500],2],['other','Канцелярия',[300,900],1],['edu','Профессиональная книга',[700,1500],back],['transport','Билеты в командировку',[6000,9000],back],['home','Гостиница в командировке',[4500,7000],back]];
    work.forEach(([cat,note,[a,b],n])=>{for(let i=0;i<n;i++){const d=1+Math.floor(rnd()*last);add(D(d),cat,note,between(a,b),'card','work')}});
    const inc=(day,cat,note,amount,account='personal')=>{if(day<=last){add(D(day),cat,note,amount,'transfer',account);items[items.length-1].type='income'}};
    inc(5,'inc_salary','Аванс',45000);inc(20,'inc_salary','Зарплата',60000);inc(14,'inc_side','Оплата за проект',25000,'work');
    if(back){inc(25,'inc_refund','Кэшбэк за месяц',between(800,1500));inc(12,'inc_other','Компенсация командировки',between(15000,20000),'work')}
  }
  return {items,budgets:{personal:{food:25000,cafe:9000,transport:6000,fun:5000,clothes:6000},work:{transport:12000,cafe:5000}}};
}

function monthItems(y,m,all){const k=ymKey(y,m);return state.items.filter(e=>(e.date||'').startsWith(k)&&(all||inAcc(e)))}
function sum(list){return list.reduce((s,e)=>s+(+e.amount||0),0)}

/* ---------- render ---------- */

  const {y,m}=state;

  else if(state.migrate&&!state.readOnly)n=`<div class="notice"><span>У вас есть ${state.migrate.items.length} ${plural(state.migrate.items.length,'запись','записи','записей')}, которые раньше хранились только ${tg?'в Telegram':'в этом браузере'}. Перенести их в общие записи?</span><button class="linkbtn" id="migYes">Перенести</button><button class="linkbtn" id="migNo">Не переносить</button></div>`;
  else if(hasEx&&!state.readOnly)n=`<div class="notice"><span>Сейчас здесь примеры, чтобы было видно, как всё работает. Записи с пометкой «пример» можно удалить разом.</span><button class="linkbtn" id="clearEx">Удалить примеры</button></div>`;
  else if((state.mode==='db'||state.mode==='cloud'||state.mode==='gh')&&state.dbLoaded&&!state.items.length&&!state.readOnly)n=`<div class="notice"><span>Пока нет ни одной записи. Добавьте первую запись кнопкой «+ Добавить» или загрузите примеры.</span><button class="linkbtn" id="loadEx">Загрузить примеры</button></div>`;
  $('#notice').innerHTML=n;
  const my=$('#migYes');if(my)my.onclick=async()=>{const m=state.migrate;state.migrate=null;
    try{await backend.addMany(m.items,'Перенесены записи из личного хранилища: '+m.items.length);
      const b=state.budgets;if(!Object.keys(b.personal||{}).length&&!Object.keys(b.work||{}).length&&(Object.keys(m.budgets.personal||{}).length||Object.keys(m.budgets.work||{}).length))await backend.setBudgets(m.budgets);
      await kv.set('migrated','1');toast('Записи перенесены')}catch(e){state.migrate=m;render()}};
  const mn=$('#migNo');if(mn)mn.onclick=async()=>{state.migrate=null;await kv.set('migrated','1');render()};
  const ce=$('#clearEx');if(ce)ce.onclick=async()=>{await backend.removeMany(state.items.filter(e=>e.example).map(e=>e.id));toast('Примеры удалены')};
  const le=$('#loadEx');if(le)le.onclick=async()=>{const ex=makeExamples();await backend.addMany(ex.items);if(!Object.keys(state.budgets.personal).length&&!Object.keys(state.budgets.work).length)await backend.setBudgets(ex.budgets);toast('Примеры загружены')};

  // KPIs
  const isCur=y===now.getFullYear()&&m===now.getMonth();
  const future=new Date(y,m,1)>now;
  const elapsed=future?0:isCur?now.getDate():daysIn(y,m);
  const byCat={};cur.forEach(e=>{const k=catKey(e);byCat[k]=(byCat[k]||0)+(+e.amount||0)});
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  let delta='<span>нет данных за прошлый месяц</span>';
  if(ptotal>0){const p=(total-ptotal)/ptotal*100;delta=`<span class="${p>0?'up':'down'}">${p>0?'▲':'▼'} ${fmt.format(Math.abs(Math.round(p)))}%</span> к прошлому месяцу`}
  const cnt=cur.length;
  const leadSub=state.acc==='all'?`Личный ${short(sum(cur.filter(e=>accOf(e)==='personal')))} ₽ · Рабочий ${short(sum(cur.filter(e=>accOf(e)==='work')))} ₽`:`${cnt} ${plural(cnt,'операция','операции','операций')}`;
  const leadK=state.acc==='all'?'Потрачено за месяц':'Потрачено · '+ACCOUNTS[state.acc].toLowerCase()+' счёт';
  $('#kpis').innerHTML=`
    <div class="kpi lead"><div class="k">${leadK}</div><div class="v num">${money(total)}</div><div class="d num">${leadSub}</div></div>
    <div class="kpi"><div class="k">Прошлый месяц</div><div class="v num">${money(ptotal)}</div><div class="d">${delta}</div></div>
    <div class="kpi"><div class="k">В среднем в день</div><div class="v num">${elapsed?money(total/elapsed):'—'}</div><div class="d">${elapsed?`за ${elapsed} ${plural(elapsed,'день','дня','дней')}`:'месяц ещё не начался'}</div></div>
    <div class="kpi"><div class="k">Больше всего на</div><div class="v">${top?esc(catOf(top[0]).name):'—'}</div><div class="d">${top?`${money(top[1])} · ${Math.round(top[1]/total*100)}% расходов`:'нет расходов'}</div></div>`;

  renderCats(byCat,total);
  renderDays(cur,y,m,elapsed,total);
  renderList(all,byCat);
  renderOverall();
}

function renderOverall(){
  const el=$('#overall');
  const list=state.items.filter(inAcc);
  if(!list.length){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;
  const exp=sum(list.filter(isExp)),inc=sum(list.filter(e=>!isExp(e))),bal=inc-exp;
  const dates=list.map(e=>e.date).sort();
  const f=d=>{const p=d.split('-');return +p[2]+' '+MONTHS_GEN[+p[1]-1]+' '+p[0]};
  const acc=state.acc==='all'?'оба счёта':ACCOUNTS[state.acc].toLowerCase()+' счёт';
  el.innerHTML=`<div class="ov-head"><div class="ov-t">За всё время</div><div class="sub">${f(dates[0])} — ${f(dates[dates.length-1])} · ${acc}</div></div>
    <div class="ov"><div class="ov-k">Зачислено</div><div class="ov-v num inc">+ ${money(inc)}</div></div>
    <div class="ov"><div class="ov-k">Израсходовано</div><div class="ov-v num">− ${money(exp)}</div></div>
    <div class="ov"><div class="ov-k">Остаток</div><div class="ov-v num ${bal<0?'neg':''}">${bal<0?'− ':''}${money(Math.abs(bal))}</div></div>`;
}

function renderCats(byCat,total){
  const el=$('#cats');const b=curBudgets();
  $('#budgetBtn').textContent=state.budgetEdit?'Готово':'Лимиты';
  $('#budgetBtn').hidden=state.readOnly||state.acc==='all';
  $('#catsBtn').hidden=state.readOnly||state.mode==='setup'||state.mode==='loading';
  if(state.budgetEdit){
    el.innerHTML=`<div class="sub">Месячные лимиты для счёта «${ACCOUNTS[state.acc]}». Пустое поле означает без лимита.</div>`+
      CATS.map(c=>`<div class="bedit"><label class="cname" for="b-${c.id}"><span class="dot" style="background:${c.color}"></span><span>${c.name}</span></label><input id="b-${c.id}" class="num" type="number" min="0" step="100" inputmode="numeric" placeholder="без лимита" value="${b[c.id]||''}"></div>`).join('');
    return;
  }
  const rows=[...CATS,...(byCat.__none?[UNCAT]:[])].filter(c=>byCat[c.id]||b[c.id]).map(c=>({c,v:byCat[c.id]||0,lim:+b[c.id]||0})).sort((a,b2)=>b2.v-a.v);
  if(!rows.length){el.innerHTML='<div class="empty">В этом месяце расходов нет.</div>';return}
  const hint=state.acc==='all'&&Object.keys(b).length?'<div class="sub">Лимиты сложены по обоим счетам. Чтобы изменить их, выберите «Личный» или «Рабочий».</div>':'';
  const scale=Math.max(...rows.map(r=>Math.max(r.v,r.lim)))||1;
  el.innerHTML=rows.map(({c,v,lim})=>{
    let meta=total?`${Math.round(v/total*100)}% от всех расходов`:'';
    if(lim){const left=lim-v;const r=v/lim;
      meta=left<0?`<span class="over">Лимит ${money(lim)} превышен на ${money(-left)}</span>`:
        `<span class="${r>=.9?'near':''}">Лимит ${money(lim)} · осталось ${money(left)}</span>`}
    const over=lim&&v>lim;
    return `<button class="crow ${state.cats.has(c.id)?'sel':''}" data-cat="${c.id}" aria-pressed="${state.cats.has(c.id)}">
      <span class="cname"><span class="dot" style="background:${c.color}"></span><span>${c.name}</span></span>
      <span class="camt num">${money(v)}</span>
      <span class="track"><span class="fill" style="width:${v/scale*100}%;background:${over?'var(--danger)':c.color}"></span>${lim?`<span class="limit" style="left:calc(${lim/scale*100}% - 1px)" title="Лимит"></span>`:''}</span>
      <span class="cmeta">${meta}</span></button>`}).join('')+hint;
  el.querySelectorAll('[data-cat]').forEach(btn=>btn.onclick=()=>toggleCat(btn.dataset.cat));
}

function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
function renderDays(cur,y,m,elapsed,total){
  const n=daysIn(y,m);const per=new Array(n).fill(0);
  cur.forEach(e=>{const d=+e.date.slice(8,10);if(d>=1&&d<=n)per[d-1]+=+e.amount||0});
  const W=640,H=210,L=46,R=6,T=10,B=24;const iw=W-L-R,ih=H-T-B;
  const max=niceMax(Math.max(...per));const bw=iw/n;
  const isCur=y===now.getFullYear()&&m===now.getMonth();
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Расходы по дням">`;
  [0,.5,1].forEach(f=>{const yy=T+ih-ih*f;s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+4}" text-anchor="end">${f?short(max*f):'0'}</text>`});
  per.forEach((v,i)=>{const x=L+i*bw;const h=v?Math.max(2,v/max*ih):2;const today=isCur&&i+1===now.getDate();
    s+=`<g><title>${i+1} ${MONTHS_GEN[m]}: ${money(v)}</title><rect class="hit" x="${x}" y="${T}" width="${bw}" height="${ih}"/><rect class="bar ${v?'':'zero'} ${today?'today':''}" x="${x+bw*.18}" y="${T+ih-h}" width="${bw*.64}" height="${h}" rx="2"/></g>`;
    if(i===0||(i+1)%5===0)s+=`<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${i+1}</text>`});
  s+='</svg>';
  const maxDay=per.indexOf(Math.max(...per));
  const noSpend=per.slice(0,elapsed).filter(v=>!v).length;
  s+=`<div class="daystat"><span>Самый затратный день: <b>${total?`${maxDay+1} ${MONTHS_GEN[m]} · ${money(per[maxDay])}`:'—'}</b></span><span>Дней без трат: <b>${elapsed?noSpend:'—'}</b></span>${isCur?'<span>Тёмный столбец — сегодня</span>':''}</div>`;
  $('#days').innerHTML=s;
}

function toggleCat(id){state.cats.has(id)?state.cats.delete(id):state.cats.add(id);render()}

function renderList(cur,byCat){
  const counts={};cur.forEach(e=>{const k=catKey(e);counts[k]=(counts[k]||0)+1});
  const present=[...ALLCATS,UNCAT].filter(c=>counts[c.id]);
  $('#chips').innerHTML=`<button class="chip" data-all aria-pressed="${!state.cats.size}">Все</button>`+
    present.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${state.cats.has(c.id)}"><span class="dot" style="background:${c.color}"></span>${c.name} <span class="n">${counts[c.id]}</span></button>`).join('');
  $('#chips').querySelector('[data-all]').onclick=()=>{state.cats.clear();render()};
  $('#chips').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>toggleCat(b.dataset.c));

  const q=state.q.trim().toLowerCase();
  let list=cur.filter(e=>(!state.cats.size||state.cats.has(catKey(e)))&&(!q||(e.note||'').toLowerCase().includes(q)||(e.comment||'').toLowerCase().includes(q)||catOf(e.category).name.toLowerCase().includes(q)));
  const by={
    'date-desc':(a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0),
    'date-asc':(a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0),
    'amt-desc':(a,b)=>b.amount-a.amount,'amt-asc':(a,b)=>a.amount-b.amount,
    'cat':(a,b)=>ALLCATS.findIndex(c=>c.id===a.category)-ALLCATS.findIndex(c=>c.id===b.category)||b.amount-a.amount
  }[state.sort];
  list=[...list].sort(by);
  const rows=$('#rows');
  if(!list.length){rows.innerHTML=`<tr><td colspan="5" class="empty">${cur.length?'Ничего не найдено. Измените фильтры или поиск.':'В этом месяце пока нет расходов.'}</td></tr>`}
  else rows.innerHTML=list.map(e=>{const c=catOf(e.category);const d=e.date.split('-');
    return `<tr data-id="${esc(e.id)}" tabindex="0"><td class="date num">${+d[2]} ${MONTHS_GEN[+d[1]-1]}</td><td class="note">${esc(e.note)||'<span class="sub">без описания</span>'}${state.acc==='all'?`<span class="acc ${accOf(e)}">${ACCOUNTS[accOf(e)]}</span>`:''}${e.example?'<span class="pill">пример</span>':''}${e.comment?`<span class="comment">${esc(e.comment)}</span>`:''}</td><td class="cat"><span class="tag"><span class="dot" style="background:${c.color}"></span>${c.name}</span></td><td class="method">${METHODS[e.method]||''}</td><td class="amt r num ${isExp(e)?'':'inc'}">${isExp(e)?'':'+ '}${money(+e.amount||0)}</td></tr>`}).join('');
  rows.querySelectorAll('tr[data-id]').forEach(tr=>{const open=()=>openForm(state.items.find(x=>x.id===tr.dataset.id));tr.onclick=open;tr.onkeydown=ev=>{if(ev.key==='Enter')open()}});
  const filtered=state.cats.size||q;
  $('#ltotal').innerHTML=`<span>${filtered?'Показано':'Всего'} ${list.length} ${plural(list.length,'операция','операции','операций')}</span><span>Расходы: <b class="num">${money(sum(list.filter(isExp)))}</b>${list.some(e=>!isExp(e))?` · Доходы: <b class="num inc">+ ${money(sum(list.filter(e=>!isExp(e))))}</b>`:''}</span>`;
}

    <div class="field"><span class="lbl">Счёт</span><div class="seg">${Object.entries(ACCOUNTS).map(([k,v])=>`<label><input type="radio" name="acc" value="${k}" ${k===eAcc?'checked':''}>${v}</label>`).join('')}</div></div>
    <div class="row2">
      <div class="field"><label for="fAmount">Сумма, ₽</label><input id="fAmount" class="amount-in num" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" value="${e.amount}" required></div>
      <div class="field"><label for="fDate">Дата</label><input id="fDate" type="date" value="${e.date}" required></div>
    </div>
    <div class="field"><label for="fNote">Описание</label><input id="fNote" type="text" maxlength="120" placeholder="Например, продукты на неделю" value="${esc(e.note)}"></div>
    <div class="field"><label for="fComment">Комментарий</label><textarea id="fComment" maxlength="500" rows="2" placeholder="Необязательно: подробности, для чего, кто платил">${esc(e.comment||'')}</textarea></div>
    <div class="field"><span class="lbl">Категория</span><div class="catpick" id="catpick">${catPickHtml(eType,e.category)}</div></div>
    <div class="field"><span class="lbl">Способ оплаты</span><div class="seg">${Object.entries(METHODS).map(([k,v])=>`<label><input type="radio" name="method" value="${k}" ${k===e.method?'checked':''}>${v}</label>`).join('')}</div></div>
    <div class="err-text" id="fErr" hidden></div>
    <div class="mfoot">${item&&!state.readOnly?'<button type="button" class="btn danger" id="fDel">Удалить</button>':''}
      <div class="right"><button type="button" class="btn" id="fCancel">Отмена</button>${state.readOnly?'':'<button type="submit" class="btn primary">Сохранить</button>'}</div></div>
  </form></div>`;
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',onKey);if(tg){tg.BackButton.offClick(close);tg.BackButton.hide()}};
  if(tg){tg.BackButton.onClick(close);tg.BackButton.show()}
  const onKey=ev=>{if(ev.key==='Escape')close()};
  document.addEventListener('keydown',onKey);
  $('#ov').addEventListener('mousedown',ev=>{if(ev.target.id==='ov')close()});
  $('#fCancel').onclick=close;
  document.querySelectorAll('input[name=type]').forEach(r=>r.onchange=()=>{$('#catpick').innerHTML=catPickHtml(r.value,null);$('#fNote').placeholder=r.value==='income'?'Например, зарплата за октябрь':'Например, продукты на неделю'});
  setTimeout(()=>$('#fAmount').focus(),0);
  const del=$('#fDel');
  if(del)del.onclick=async()=>{
    if(del.dataset.armed){close();try{await backend.remove(item.id);toast('Расход удалён')}catch(e){}return}
    del.dataset.armed='1';del.textContent='Точно удалить?';
  };
  $('#f').onsubmit=async ev=>{
    ev.preventDefault();
    const amount=parseFloat(String($('#fAmount').value).replace(',','.'));
    const date=$('#fDate').value;
    const err=$('#fErr');
    if(!(amount>0)){err.textContent='Укажите сумму больше нуля.';err.hidden=false;$('#fAmount').focus();return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent='Укажите дату.';err.hidden=false;return}
    const data={amount:Math.round(amount*100)/100,date,category:document.querySelector('input[name=cat]:checked').value,
      method:document.querySelector('input[name=method]:checked').value,account:document.querySelector('input[name=acc]:checked').value,type:document.querySelector('input[name=type]:checked').value,note:$('#fNote').value.trim(),comment:$('#fComment').value.trim(),createdAt:item?.createdAt||Date.now()};
    close();
    try{
      if(item)await backend.update(item.id,data);else await backend.add(data);
      const [yy,mm]=date.split('-').map(Number);
      if(state.acc!=='all'&&state.acc!==data.account)state.acc=data.account;
      if(yy!==state.y||mm-1!==state.m){state.y=yy;state.m=mm-1}
      render();
      toast(item?'Изменения сохранены':data.type==='income'?'Доход добавлен':'Расход добавлен');
    }catch(e){}
  };
}

/* ---------- misc ---------- */
let toastT;
function toast(t){const r=$('#toastRoot');r.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML='',2600)}

$('#prevM').onclick=()=>{const d=new Date(state.y,state.m-1,1);state.y=d.getFullYear();state.m=d.getMonth();state.cats.clear();render()};
$('#nextM').onclick=()=>{const d=new Date(state.y,state.m+1,1);state.y=d.getFullYear();state.m=d.getMonth();state.cats.clear();render()};
/* ---------- редактор категорий ---------- */
const PALETTE=['#2F9E44','#E8590C','#1C7ED6','#7048E8','#0C8599','#E03131','#C2255C','#F08C00','#5C7CFA','#D6336C','#66A80F','#868E96','#2B8A3E','#0B7285','#AE3EC9','#1971C2','#495057','#B08900'];
function openCats(){
  const T=typeof tg!=='undefined'?tg:null;
  const draft={expense:CATS.map(c=>({...c})),income:INCOME_CATS.map(c=>({...c}))};
  const used={};state.items.forEach(e=>{used[e.category]=(used[e.category]||0)+1});
  let tab='expense';
  const root=$('#modalRoot');
  root.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-label="Категории">
    <h3>Категории</h3>
    <div class="seg" role="group" aria-label="Тип"><label><input type="radio" name="ctab" value="expense" checked>Расходы</label><label><input type="radio" name="ctab" value="income">Доходы</label></div>
    <div class="sub">Нажмите на цветной квадрат, чтобы сменить цвет. Записи из удалённой категории не пропадут: они будут показаны как «Без категории».</div>
    <div class="clist" id="clist"></div>
    <div><button type="button" class="btn" id="cAdd">+ Новая категория</button></div>
    <div class="err-text" id="cErr" hidden></div>
    <div class="mfoot"><div class="right"><button type="button" class="btn" id="cCancel">Отмена</button><button type="button" class="btn primary" id="cSave">Сохранить</button></div></div>
  </div></div>`;
  const err=$('#cErr');
  const showErr=t=>{err.textContent=t;err.hidden=false};
  const draw=()=>{
    const list=draft[tab];
    $('#clist').innerHTML=list.map((c,i)=>`<div class="cedit" data-i="${i}"><button type="button" class="swatch" style="background:${c.color}" aria-label="Сменить цвет"></button><input type="text" maxlength="40" value="${esc(c.name)}" placeholder="Название категории" aria-label="Название категории"><span class="cnt">${used[c.id]?used[c.id]+' зап.':''}</span><button type="button" class="btn small danger" data-del>Удалить</button></div>`).join('');
    $('#clist').querySelectorAll('.cedit').forEach(row=>{
      const i=+row.dataset.i,c=list[i];
      row.querySelector('.swatch').onclick=ev=>{c.color=PALETTE[(PALETTE.indexOf(c.color)+1)%PALETTE.length];ev.currentTarget.style.background=c.color};
      row.querySelector('input').oninput=ev=>{c.name=ev.target.value};
      const del=row.querySelector('[data-del]');
      del.onclick=()=>{
        err.hidden=true;
        if(list.length<=1)return showErr('Нужна хотя бы одна категория.');
        if(used[c.id]&&!del.dataset.armed){del.dataset.armed='1';del.textContent='Точно?';return}
        list.splice(i,1);draw();
      };
    });
  };
  draw();
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',onKey);if(T){T.BackButton.offClick(close);T.BackButton.hide()}};
  const onKey=ev=>{if(ev.key==='Escape')close()};
  document.addEventListener('keydown',onKey);
  if(T){T.BackButton.onClick(close);T.BackButton.show()}
  $('#ov').addEventListener('mousedown',ev=>{if(ev.target.id==='ov')close()});
  root.querySelectorAll('input[name=ctab]').forEach(r=>r.onchange=()=>{tab=r.value;err.hidden=true;draw()});
  $('#cCancel').onclick=close;
  $('#cAdd').onclick=()=>{
    draft[tab].push({id:'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'',color:PALETTE[draft[tab].length%PALETTE.length]});
    draw();const ins=$('#clist').querySelectorAll('input');ins[ins.length-1].focus();
  };
  $('#cSave').onclick=async()=>{
    err.hidden=true;
    for(const t of ['expense','income']){
      const seen=new Set();
      for(const c of draft[t]){
        c.name=c.name.replace(/[<>&"]/g,'').trim();
        if(!c.name)return showErr('У одной из категорий '+(t==='income'?'доходов':'расходов')+' нет названия.');
        const k=c.name.toLowerCase();
        if(seen.has(k))return showErr('Категория «'+c.name+'» встречается дважды.');
        seen.add(k);
      }
    }
    close();
    try{await backend.setCats({expense:draft.expense,income:draft.income});toast('Категории сохранены')}catch(e){}
  };
}

$('#addBtn').onclick=()=>openForm(null);
$('#catsBtn').onclick=()=>openCats();
$('#accessBtn').onclick=()=>openAccess(false);
document.querySelectorAll('#accsw [data-acc]').forEach(b=>b.onclick=()=>{state.acc=b.dataset.acc;state.budgetEdit=false;state.cats.clear();render()});
$('#q').oninput=e=>{state.q=e.target.value;render()};
$('#sort').onchange=e=>{state.sort=e.target.value;render()};
$('#budgetBtn').onclick=async()=>{
  if(state.budgetEdit){
    const b={};CATS.forEach(c=>{const v=parseFloat($('#b-'+c.id).value);if(v>0)b[c.id]=Math.round(v)});
    state.budgetEdit=false;
    try{await backend.setBudgets({...state.budgets,[state.acc]:b});toast('Лимиты сохранены')}catch(e){}
    render();
  }else{state.budgetEdit=true;render()}
};
render();
</script>

</body>
</html>
